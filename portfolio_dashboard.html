<style>

button:hover{background:#4340a0;}
.err{color:#F09595;font-size:12px;margin-top:10px;text-align:center;min-height:18px;}

async function unlock(){
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('err');
  if(!pw){ errEl.textContent='Enter your password'; return; }
  errEl.textContent='Decrypting…';

  try{
    const raw = Uint8Array.from(atob(PAYLOAD), c=>c.charCodeAt(0));
    const salt = raw.slice(0,32);
    const iv   = raw.slice(32,44);
    const tag  = raw.slice(44,60);
    const ct   = raw.slice(60);

    // Derive key
    const keyMat = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
      keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']
    );

    // AES-GCM decrypt (tag appended to ciphertext for WebCrypto)
    const combined = new Uint8Array(ct.length + tag.length);
    combined.set(ct); combined.set(tag, ct.length);

    const dec = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, combined);
    const html = new TextDecoder().decode(dec);

    // Replace page with decrypted dashboard
    document.open(); document.write(html); document.close();

  } catch(e){
    errEl.textContent='Wrong password — try again';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

// Auto-focus password field
document.getElementById('pw').focus();
